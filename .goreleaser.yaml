version: 2

project_name: herdrctx

builds:
  - id: herdrctx
    main: ./cmd/herdrctx
    binary: herdrctx
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X main.version={{ .Version }}
    targets:
      - darwin_amd64
      - darwin_arm64
      - linux_amd64
      - linux_arm64

archives:
  - id: herdrctx
    ids:
      - herdrctx
    formats:
      - tar.gz
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ if eq .Os \"darwin\" }}macos{{ else }}{{ .Os }}{{ end }}_{{ if eq .Arch \"amd64\" }}x86_64{{ else if eq .Arch \"arm64\" }}aarch64{{ else }}{{ .Arch }}{{ end }}"

checksum:
  name_template: checksums.txt

homebrew_casks:
  - name: herdrctx
    ids:
      - herdrctx
    binaries:
      - herdrctx
    repository:
      owner: j0urneyk
      name: homebrew-tap
      branch: main
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    directory: Casks
    commit_author:
      name: j0urneyk
      email: j0urneyk@users.noreply.github.com
    commit_msg_template: "Update herdrctx to {{ .Tag }}"
    homepage: https://github.com/j0urneyk/herdrctx
    description: Terminal UI for managing local Herdr sessions
    url:
      verified: github.com/j0urneyk/herdrctx/releases/download/
    caveats: |
      herdrctx requires herdr 0.6.5 or newer on your PATH.

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"

release:
  draft: false
  prerelease: auto
