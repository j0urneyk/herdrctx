name: Release

on:
  push:
    tags:
      - "v*"

permissions: read-all

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.12.0

      - name: Check formatting
        run: |
          "$(go env GOPATH)/bin/golangci-lint" fmt
          git diff --exit-code

      - name: Test
        run: go test ./...

      - name: Vet
        run: go vet ./...

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
        with:
          version: v2.12

  release:
    name: GoReleaser
    runs-on: ubuntu-latest
    needs: validate
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: v2.16.0
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update Homebrew formula
        env:
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          if [ -z "${HOMEBREW_TAP_GITHUB_TOKEN}" ]; then
            echo "HOMEBREW_TAP_GITHUB_TOKEN is required to update the Homebrew tap."
            exit 1
          fi

          version="${TAG_NAME#v}"
          tarball_url="https://github.com/j0urneyk/herdrctx/archive/refs/tags/${TAG_NAME}.tar.gz"
          sha256="$(curl -fsSL "$tarball_url" | shasum -a 256 | awk '{print $1}')"
          tap_dir="$(mktemp -d)"
          trap 'rm -rf "$tap_dir"' EXIT

          git clone https://github.com/j0urneyk/homebrew-tap.git "$tap_dir"
          cd "$tap_dir"
          git remote set-url origin "https://x-access-token:${HOMEBREW_TAP_GITHUB_TOKEN}@github.com/j0urneyk/homebrew-tap.git"

          mkdir -p Formula
          rm -f Casks/herdrctx.rb
          rmdir Casks 2>/dev/null || true
          cat > Formula/herdrctx.rb <<EOF
          class Herdrctx < Formula
            desc "Terminal UI for managing local Herdr sessions"
            homepage "https://github.com/j0urneyk/herdrctx"
            url "${tarball_url}"
            sha256 "${sha256}"

            depends_on "go" => :build

            def install
              system "go", "build", *std_go_args(ldflags: "-s -w -X main.version=#{version}"), "./cmd/herdrctx"
            end

            test do
              assert_match version.to_s, shell_output("#{bin}/herdrctx --version")
            end
          end
          EOF

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Homebrew formula is already up to date."
            exit 0
          fi

          git commit -m "Update herdrctx to ${TAG_NAME}"
          git push origin HEAD:main
