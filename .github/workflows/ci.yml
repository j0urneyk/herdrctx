name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_call:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  test:
    name: Test (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Linux x86_64
            runner: ubuntu-24.04
            goos: linux
            goarch: amd64
          - platform: Linux arm64
            runner: ubuntu-24.04-arm
            goos: linux
            goarch: arm64
          - platform: macOS x86_64
            runner: macos-15-intel
            goos: darwin
            goarch: amd64
          - platform: macOS arm64
            runner: macos-15
            goos: darwin
            goarch: arm64
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Check native Go environment
        env:
          EXPECTED_GOOS: ${{ matrix.goos }}
          EXPECTED_GOARCH: ${{ matrix.goarch }}
        run: |
          go version
          go env GOHOSTOS GOHOSTARCH GOOS GOARCH
          test "$(go env GOHOSTOS)" = "$EXPECTED_GOOS"
          test "$(go env GOHOSTARCH)" = "$EXPECTED_GOARCH"
          test "$(go env GOOS)" = "$EXPECTED_GOOS"
          test "$(go env GOARCH)" = "$EXPECTED_GOARCH"

      - name: Test
        run: go test ./...

      - name: Vet
        run: go vet ./...

      - name: Build
        run: CGO_ENABLED=0 go build -o bin/herdrctx ./cmd/herdrctx

      - name: Check binary version and help
        run: |
          version_output="$(./bin/herdrctx --version)"
          printf '%s\n' "$version_output"
          test "$version_output" = 'herdrctx dev'
          help_output="$(./bin/herdrctx --help 2>&1)"
          printf '%s\n' "$help_output"
          printf '%s\n' "$help_output" | grep -Fq 'Usage: herdrctx [flags]'
          printf '%s\n' "$help_output" | grep -Fq -- '-herdr-bin'

      - name: Test plugin installer
        run: python3 scripts/test-plugin-install.py

      - name: Install Herdr 0.6.5
        run: |
          mkdir -p dist/integration
          uname -a > dist/integration/host.txt
          python3 --version >> dist/integration/host.txt
          bash scripts/install-test-herdr.sh 2>&1 | tee dist/integration/install.log

      - name: Test real Herdr lifecycle
        timeout-minutes: 5
        run: python3 scripts/test-herdr-integration.py

      - name: Install Herdr 0.7.0 for plugin checks
        run: bash scripts/install-test-plugin-herdr.sh

      - name: Test plugin registration and nested guards
        timeout-minutes: 2
        run: python3 scripts/test-plugin-herdr.py --herdr bin/herdr-plugin-ci --start-server

      - name: Preserve integration failure logs
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: herdr-integration-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/integration/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7

  lint:
    name: Format and lint (Linux x86_64)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.12.0

      - name: Check formatting
        run: |
          "$(go env GOPATH)/bin/golangci-lint" fmt
          git diff --exit-code

      - name: Run golangci-lint
        run: '"$(go env GOPATH)/bin/golangci-lint" run'
